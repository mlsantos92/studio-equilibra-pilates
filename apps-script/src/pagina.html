<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<base target="_top">
<title>Studio Equilibra Pilates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>*{box-sizing:border-box}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* Layout: barra superior com login simulado + abas; agenda semanal em grade de 15 min com blocos coloridos por profissional; painéis em modal */
:root{
  --bg:#F4F6F4; --surface:#FFFFFF; --surface-2:#F2F5F3; --ink:#1F2B27; --muted:#5E6D67; --line:#DCE4E0; --line-strong:#B9C7C1;
  --accent:#406458; --accent-ink:#FFFFFF; --accent-soft:#E1EBE6;
  --brand-red:#A23933;
  --p1:#A23933; --p1-soft:#F7E3E1; --p2:#406458; --p2-soft:#E1EBE6; --p3:#4E7393; --p3-soft:#E2EAF2;
  --ok:#2F7A4E; --ok-soft:#DFF0E5; --warn:#9A6A10; --warn-soft:#F8EDD6; --bad:#A23933; --bad-soft:#F7E3E1;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --row:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131A18; --surface:#1A2320; --surface-2:#202B28; --ink:#E5ECE9; --muted:#9BACA5; --line:#2C3935; --line-strong:#3F4F4A;
  --accent:#7FB09E; --accent-ink:#0F1A17; --accent-soft:#203631;
  --brand-red:#E0847C;
  --p1:#E0847C; --p1-soft:#3D2321; --p2:#7FB09E; --p2-soft:#203631; --p3:#8FB0D0; --p3-soft:#22303F;
  --ok:#6CC08F; --ok-soft:#1C3527; --warn:#E3B055; --warn-soft:#3A2E16; --bad:#E58A8A; --bad-soft:#3E2121; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131A18; --surface:#1A2320; --surface-2:#202B28; --ink:#E5ECE9; --muted:#9BACA5; --line:#2C3935; --line-strong:#3F4F4A;
  --accent:#7FB09E; --accent-ink:#0F1A17; --accent-soft:#203631;
  --brand-red:#E0847C;
  --p1:#E0847C; --p1-soft:#3D2321; --p2:#7FB09E; --p2-soft:#203631; --p3:#8FB0D0; --p3-soft:#22303F;
  --ok:#6CC08F; --ok-soft:#1C3527; --warn:#E3B055; --warn-soft:#3A2E16; --bad:#E58A8A; --bad-soft:#3E2121; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
.proto{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px}
.logo{background:#FFFFFF;border-radius:12px;padding:6px 10px;display:flex;border:1px solid var(--line)}
.logo img{height:52px;width:auto;display:block}
.brand h1{font-family:var(--body);font-weight:700;font-size:22px;margin:0;letter-spacing:.14em;color:var(--accent)}
.brand span{color:var(--muted);font-size:13px}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.owner{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.owner>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.owner small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.owner b{overflow-wrap:anywhere}
.owner a{color:var(--accent)}
.owner .pill{align-self:flex-start}
.who label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;display:flex;align-items:center;gap:6px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav.tabs button{white-space:nowrap;flex:none}
nav.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.lock{font-size:11px;background:var(--p1-soft);color:var(--brand-red);border-radius:999px;padding:1px 7px;margin-left:4px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav h2{font-family:var(--display);font-size:19px;margin:0 6px;font-weight:600}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.cal-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.cal{min-width:820px;display:grid;grid-template-columns:56px repeat(6,1fr)}
.closed{position:absolute;left:0;right:0;bottom:0;background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--bg) 6px 12px);display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-size:11.5px;color:var(--muted);font-weight:600;cursor:not-allowed}
.cal .dh{position:sticky;top:0;background:var(--surface);z-index:3;border-bottom:1px solid var(--line);padding:8px 8px;text-align:left}
.cal .dh b{display:block;font-family:var(--display);font-size:20px;font-weight:600;line-height:1.1}
.cal .dh small{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:600}
.cal .dh.today b{color:var(--accent)}
.times{position:relative;height:calc(var(--row)*52)}
.times div{position:absolute;right:8px;font-size:11px;line-height:1;color:var(--muted);transform:translateY(3px);font-variant-numeric:tabular-nums}
.day{position:relative;height:calc(var(--row)*52);border-left:1px solid var(--line);cursor:crosshair;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--row)*4 - 1px),var(--line) calc(var(--row)*4 - 1px),var(--line) calc(var(--row)*4)),
  repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--row) - 1px),var(--surface-2) calc(var(--row) - 1px),var(--surface-2) var(--row))}
.hover-slot{position:absolute;left:2px;right:2px;height:calc(var(--row)*3);border:1.5px dashed var(--accent);border-radius:6px;pointer-events:none;background:var(--accent-soft);opacity:.7;display:flex;align-items:flex-start;padding:2px 6px;font-size:11px;font-weight:600;color:var(--accent)}
.ap{position:absolute;border-radius:6px;padding:3px 5px;font-size:11.5px;line-height:1.25;overflow:hidden;border:0;text-align:left;cursor:pointer;border-left:3px solid var(--c);background:var(--cs);color:var(--ink);display:flex;flex-direction:column;gap:1px}
.ap:hover{filter:brightness(.97);z-index:2;box-shadow:0 2px 8px rgb(0 0 0 / .12)}
.ap{min-width:0}
.ap b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap i{font-style:normal;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap.done{opacity:.6}
.ap.done b::after{content:" ✓";color:var(--ok)}
.ap.mine{}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;background:var(--surface-2);position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
input[type=text],input[type=email],input[type=tel],input[type=search],select,textarea{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 10px}
textarea{min-height:70px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.overlay{position:fixed;inset:0;background:rgb(10 20 22 / .45);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgb(0 0 0 / .25);margin-top:4vh}
.modal h3{font-family:var(--display);font-size:20px;margin:0;font-weight:600}
.modal .sub{color:var(--muted);margin-top:-8px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.eqs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:480px){.eqs{grid-template-columns:repeat(2,1fr)}}
.eq{border:1.5px solid var(--line-strong);border-radius:10px;padding:8px 10px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:2px}
.eq b{font-weight:700}
.eq small{color:var(--muted);font-variant-numeric:tabular-nums}
.eq[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.eq:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.hist{display:flex;flex-direction:column;gap:8px}
.hist .h{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2)}
.hist .h .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.hist .h p{margin:4px 0 0}
.clist{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.clist button{display:flex;width:100%;justify-content:space-between;gap:8px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:7px 10px;text-align:left}
.clist button:hover,.clist button[aria-pressed="true"]{background:var(--accent-soft)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi small{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi b{display:block;font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi span{color:var(--muted);font-size:12.5px}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:200px;padding-top:10px}
.bars .col{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:0;position:relative}
.bars .seg1{background:var(--accent);border-radius:4px 4px 0 0}
.bars .seg2{background:var(--accent);opacity:.45}
.bars .seg3{background:repeating-linear-gradient(45deg,var(--p1) 0 3px,transparent 3px 6px);border:1px solid var(--p1);border-radius:4px 4px 0 0}
.bars .lbl{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
.bars .val{font-size:10.5px;color:var(--ink);text-align:center;font-variant-numeric:tabular-nums;margin-bottom:2px;white-space:nowrap}
.mlabels{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.mlabels div{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.keys{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.keys span{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;font-weight:600;max-width:calc(100% - 32px)}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:12.5px;color:var(--muted)}
h2.sec{font-family:var(--display);font-size:19px;margin:0;font-weight:600}
.msgbox{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.tplgrid .pv{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.recdays{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media (max-width:480px){.recdays{grid-template-columns:repeat(2,1fr)}}
.recday{border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.recday.on{border-color:var(--accent)}
.recday select{padding:4px 6px}
.banner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 14px}
.lembretes{display:flex;flex-direction:column;gap:10px}
.lem-group{display:flex;flex-direction:column;gap:6px}
.lem-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);cursor:default}
details.lem-group summary{cursor:pointer;margin-bottom:6px}
.lem{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.lem.sent{opacity:.65}
.lem-info{display:flex;flex-direction:column;min-width:0}
.btn.wa{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);text-decoration:none;white-space:nowrap}
@media (max-width:480px){.lem{flex-direction:column;align-items:stretch}.btn.wa{text-align:center;padding:10px}}
.planos{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.plano-op{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 9px;cursor:pointer}
.plano-op:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.rec-alert{background:var(--bad-soft);border-color:var(--bad)}
.recbtn{border-radius:999px;padding:6px 12px;font-weight:600;font-size:12.5px;white-space:nowrap;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.recbtn.ok{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.recbtn.off{border:0;background:transparent;color:var(--muted);text-align:center}
.recibo{border:1px solid var(--line-strong);border-radius:12px;padding:16px;background:#FFFFFF;color:#1F2B27;display:flex;flex-direction:column;gap:12px}
.rec-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.rec-top img{height:44px;width:auto}
.rec-n{text-align:right;display:flex;flex-direction:column}
.rec-n small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#5E6D67}
.rec-v{font-family:var(--display);font-size:26px;font-weight:600;color:#406458}
.recibo p{margin:0;line-height:1.6}
.rec-ass{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;font-size:13px}
.rec-line{border-top:1px solid #1F2B27;padding-top:4px;min-width:180px;text-align:center}
.sync{font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;align-self:flex-start}
.sync.bad{color:var(--bad);border-color:var(--bad)}
.desp{display:flex;flex-direction:column;gap:10px}
.desplist{display:flex;flex-direction:column;gap:6px}
.desprow{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:8px;align-items:center}
.mlabels.liq div{font-variant-numeric:tabular-nums;font-weight:600;font-size:11px}
.ren-alert{background:var(--warn-soft);border-color:var(--warn)}
.renov{display:flex;flex-direction:column;gap:8px;border-color:var(--warn)}
.renrow{grid-template-columns:minmax(0,1fr) auto auto}
tr.inativo td{opacity:.6}
.tabela{display:flex;flex-direction:column;gap:10px}
.tabgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tabcol{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tabrow{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums;font-size:13px}
.pay{display:flex;flex-direction:column;gap:10px}
.paylist{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.payrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
.payval{font-variant-numeric:tabular-nums;font-weight:600;border:1px dashed var(--line-strong);background:transparent;border-radius:8px;padding:4px 8px;color:var(--ink);white-space:nowrap}
.payval:hover{border-color:var(--accent);background:var(--accent-soft)}
.paybtn{border-radius:999px;padding:6px 12px;font-weight:600;font-size:12.5px;white-space:nowrap;border:1px solid transparent}
.paybtn.paid{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.paybtn.pend{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
@media (max-width:560px){.payrow{grid-template-columns:minmax(0,1fr) auto}.paybtn,.recbtn{grid-column:auto}.recbtn.off{display:none}}
.cellpay{border:0;background:transparent;padding:2px 4px;border-radius:4px;font-variant-numeric:tabular-nums;color:var(--ink)}
.cellpay:hover{background:var(--accent-soft)}
.cellpay.pend{color:var(--warn)}
.cellpay.proj{color:var(--muted)}
.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.checks label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

:root{--p4:#8A6D3B;--p4-soft:#F3EBDD;--p5:#6B5B95;--p5-soft:#ECE8F4;--p6:#2F8F8B;--p6-soft:#DDF0EF;--p7:#B5651D;--p7-soft:#F6E6D8;--p8:#5C6B73;--p8-soft:#E6EAEC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--p4:#C9A46A;--p4-soft:#33291A;--p5:#A898D0;--p5-soft:#2A2638;--p6:#6CC4BF;--p6-soft:#1B3332;--p7:#E09A5C;--p7-soft:#3A2817;--p8:#9AA9B1;--p8-soft:#262C30}}
:root[data-theme="dark"]{--p4:#C9A46A;--p4-soft:#33291A;--p5:#A898D0;--p5-soft:#2A2638;--p6:#6CC4BF;--p6-soft:#1B3332;--p7:#E09A5C;--p7-soft:#3A2817;--p8:#9AA9B1;--p8-soft:#262C30}
.ap.ocup{pointer-events:none;opacity:.6;border-style:dashed}
.team{display:grid;gap:10px;margin-block:12px}
.tm{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.tm .acts{display:flex;flex-wrap:wrap;gap:6px}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
.cores{display:flex;gap:12px;flex-wrap:wrap}.cores label{display:flex;align-items:center;gap:4px}.cores .dot{width:18px;height:18px}
